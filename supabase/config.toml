# Supabase Configuration for Web Analyzer Suite

[api]
# Disable JWT verification for public functions
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.jwt]
# Allow public access to certain edge functions
secret = "your-jwt-secret-here"
exp = 3600

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false

[edge_functions]
# Configuration for edge functions
enabled = true

# All functions require gateway JWT verification plus handler admin verification
[edge_functions.fetch-html]
verify_jwt = true

[edge_functions.capture-rendered-html]
verify_jwt = true

[edge_functions.firecrawl-map]
verify_jwt = true

[edge_functions.lighthouse]
verify_jwt = true

# Protected functions (auth required)
[edge_functions.capture-screenshot]
verify_jwt = true

[edge_functions.ai-website-analyze]
verify_jwt = true

[edge_functions.ai-extract-project-info]
verify_jwt = true

[edge_functions.scheduled-screenshots]
verify_jwt = true

[functions.scheduled-screenshots]
verify_jwt = true


[functions.capture-rendered-html]
verify_jwt = true


[functions.firecrawl-map]
verify_jwt = true


[functions.lighthouse]
verify_jwt = true


[functions.capture-screenshot]
verify_jwt = true


[functions.fetch-html]
verify_jwt = true


[functions.ai-extract-project-info]
verify_jwt = true


[functions.ai-website-analyze]
verify_jwt = true
