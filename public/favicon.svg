  <!-- Center Swiss Cross (+) inside the X intersection -->
  <circle cx="32" cy="32" r="6.2" fill="#080C14" stroke="url(#xGold)" stroke-width="1.2"/>
  <path d="M31 28.5 H33 V31 H35.5 V33 H33 V35.5 H31 V33 H28.5 V31 H31 Z" fill="#FFFFFF"/>
</svg>