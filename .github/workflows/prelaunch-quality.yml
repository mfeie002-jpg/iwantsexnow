name: Prelaunch quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --package-lock-only --audit-level=low
      - name: PDF export compatibility
        run: node --test tests/pdf-export.test.mjs
      - name: Image and CSS dependency compatibility
        run: node --test tests/dependency-runtime.test.mjs tests/css-selector-compatibility.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Public-preview safety checks
        run: node scripts/preview-smoke.cjs
      - name: Preview copy, contact and internal-link integrity
        run: node scripts/preview-integrity.cjs
      - name: Provider publication policy tests
        run: node --experimental-strip-types --test tests/marketplace-publication.test.mjs
      - name: Private provider draft ownership and input tests
        run: node --experimental-strip-types --test tests/marketplace-drafts.test.mjs tests/supabase-drafts.test.mjs tests/integration-client.test.mjs
      - name: Analyzer API authorization policy tests
        run: node --experimental-strip-types --test tests/analyzer-proxy.test.mjs
      - name: Mocked authenticated handler and role gate tests
        run: node --test tests/analyzer-proxy-handler.test.mjs
      - name: Public API must reject unauthenticated requests
        run: |
          npx next start --hostname 127.0.0.1 --port 43127 > /tmp/next-prelaunch.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:43127/; then break; fi
            sleep 1
          done
          node scripts/analyzer-api-http-smoke.mjs
          node scripts/preview-http-smoke.mjs
